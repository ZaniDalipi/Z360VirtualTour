<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <!-- Gradients for 3D effect on panels -->
    <linearGradient id="panelLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#4A7AE0"/>
    </linearGradient>
    <linearGradient id="panelMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B9DF5"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="panelRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AAEF8"/>
      <stop offset="100%" stop-color="#6B9DF5"/>
    </linearGradient>
    <!-- Top face gradients -->
    <linearGradient id="topLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B9DF5"/>
      <stop offset="100%" stop-color="#7AAEF8"/>
    </linearGradient>
    <linearGradient id="topMiddle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AAEF8"/>
      <stop offset="100%" stop-color="#8BBFFF"/>
    </linearGradient>
    <linearGradient id="topRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BBFFF"/>
      <stop offset="100%" stop-color="#9BCFFF"/>
    </linearGradient>
  </defs>

  <!-- Building Icon - 3 panels in isometric style -->
  <g transform="translate(85, 8)">
    <!-- Left panel (shortest) - front face -->
    <path d="M0 45 L0 25 L12 18 L12 38 Z" fill="url(#panelLeft)"/>
    <!-- Left panel - top face -->
    <path d="M0 25 L12 18 L24 24 L12 31 Z" fill="url(#topLeft)"/>
    <!-- Left panel - right face -->
    <path d="M12 18 L24 24 L24 44 L12 38 Z" fill="#4A7AE0"/>

    <!-- Middle panel - front face -->
    <path d="M20 38 L20 12 L32 5 L32 31 Z" fill="url(#panelMiddle)"/>
    <!-- Middle panel - top face -->
    <path d="M20 12 L32 5 L44 11 L32 18 Z" fill="url(#topMiddle)"/>
    <!-- Middle panel - right face -->
    <path d="M32 5 L44 11 L44 37 L32 31 Z" fill="#5B8DEF"/>

    <!-- Right panel (tallest) - front face -->
    <path d="M40 31 L40 0 L52 -7 L52 24 Z" fill="url(#panelRight)"/>
    <!-- Right panel - top face -->
    <path d="M40 0 L52 -7 L64 -1 L52 6 Z" fill="url(#topRight)"/>
    <!-- Right panel - right face -->
    <path d="M52 -7 L64 -1 L64 30 L52 24 Z" fill="#6B9DF5"/>
  </g>

  <!-- Text: BALKANESTATE -->
  <text x="120" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#4A7AE0" text-anchor="middle" letter-spacing="1">BALKANESTATE</text>
</svg>
