<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" fill="none">
  <defs>
    <linearGradient id="gridGradientH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C9A962;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="150" fill="#0D1B2A"/>

  <!-- Z Letter -->
  <text x="30" y="85" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="#E8DCC4" font-style="italic">Z</text>

  <!-- Camera/Location Icon -->
  <g transform="translate(85, 25)">
    <rect x="5" y="0" width="42" height="50" rx="7" fill="#E8DCC4"/>
    <circle cx="26" cy="20" r="9" fill="#0D1B2A"/>
    <circle cx="26" cy="20" r="4" fill="#E8DCC4"/>
  </g>

  <!-- 360 with circular arrow -->
  <g transform="translate(90, 45)">
    <!-- Circular arrow -->
    <path d="M40 22C40 32 32 40 22 40C12 40 4 32 4 22C4 12 12 4 22 4"
          stroke="#E8DCC4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="22,0 26,7 18,7" fill="#E8DCC4"/>
    <!-- 360 text -->
    <text x="22" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E8DCC4" text-anchor="middle">360</text>
  </g>

  <!-- 360 VIRTUAL TOURS text -->
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#E8DCC4" text-anchor="middle" letter-spacing="4">360 VIRTUAL TOURS</text>

  <!-- Buildings silhouette -->
  <g transform="translate(240, 25)" stroke="#C9A962" stroke-width="1" fill="none" opacity="0.5">
    <!-- House 1 -->
    <path d="M0 55 L0 35 L15 20 L30 35 L30 55"/>
    <rect x="10" y="40" width="10" height="15"/>

    <!-- Building -->
    <rect x="40" y="20" width="35" height="35"/>
    <rect x="45" y="25" width="5" height="5"/>
    <rect x="55" y="25" width="5" height="5"/>
    <rect x="65" y="25" width="5" height="5"/>
    <rect x="45" y="35" width="5" height="5"/>
    <rect x="55" y="35" width="5" height="5"/>
    <rect x="65" y="35" width="5" height="5"/>
    <rect x="45" y="45" width="5" height="5"/>
    <rect x="55" y="45" width="5" height="5"/>
    <rect x="65" y="45" width="5" height="5"/>

    <!-- House 2 -->
    <path d="M90 55 L90 35 L105 20 L120 35 L120 55"/>
    <rect x="100" y="40" width="10" height="15"/>
  </g>

  <!-- Grid wave pattern at bottom -->
  <g transform="translate(0, 100)" stroke="#C9A962" stroke-width="0.5" fill="none" opacity="0.35">
    <path d="M0 25 Q100 5 200 25 T400 25"/>
    <path d="M0 35 Q100 15 200 35 T400 35"/>
    <path d="M0 45 Q100 25 200 45 T400 45"/>
    <!-- Vertical lines -->
    <line x1="40" y1="20" x2="40" y2="50"/>
    <line x1="80" y1="15" x2="80" y2="50"/>
    <line x1="120" y1="12" x2="120" y2="50"/>
    <line x1="160" y1="15" x2="160" y2="50"/>
    <line x1="200" y1="20" x2="200" y2="50"/>
    <line x1="240" y1="25" x2="240" y2="50"/>
    <line x1="280" y1="22" x2="280" y2="50"/>
    <line x1="320" y1="17" x2="320" y2="50"/>
    <line x1="360" y1="14" x2="360" y2="50"/>
  </g>
</svg>
